# User-level Gradle defaults. A repo's own gradle.properties wins for any key it sets
# (every repo here sets org.gradle.jvmargs, so it is deliberately absent).
org.gradle.parallel=true
org.gradle.caching=true
# Stop idle daemons after 1 hour instead of the 3-hour default to free their memory.
org.gradle.daemon.idletimeout=3600000
